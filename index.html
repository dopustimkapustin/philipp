<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Philipp AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    .hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(86vw, 420px);
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.68);
      font: 600 15px/1.25 system-ui, -apple-system, sans-serif;
      text-align: center;
      transition: opacity 220ms ease;
      pointer-events: none;
    }
    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="hint" id="hint">Point the camera at the artwork</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; warmupTolerance: 3; missTolerance: 10; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    embedded>

    <a-assets timeout="30000">
      <video
        id="ar-video"
        src="./video.mp4"
        preload="auto"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video
        src="#ar-video"
        position="0 0 0.01"
        width="1"
        height="1"
        material="shader: flat; transparent: false; side: double;"
        rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector('#ar-video');
    const target = document.querySelector('#target');
    const hint = document.querySelector('#hint');

    video.muted = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');

    const startVideo = () => video.play().catch(() => {
      hint.textContent = 'Tap the screen once, then point at the artwork';
    });

    target.addEventListener('targetFound', () => {
      hint.classList.add('hidden');
      startVideo();
    });

    target.addEventListener('targetLost', () => {
      hint.classList.remove('hidden');
      hint.textContent = 'Point the camera at the artwork';
    });

    document.addEventListener('pointerdown', startVideo, {once: true});
  </script>
</body>
</html>
